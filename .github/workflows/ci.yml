# Continuous integration for the TechCorp AI Agents Lab Course (Module 21).
#
# On every push and pull request: set up uv + Python 3.12, install the locked
# dependencies, lint and format-check, then run the OFFLINE test suite. No
# secrets are referenced and the `live` marker is never selected, so the whole
# workflow runs deterministically against the mock adapters — the same suite a
# learner runs locally.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    # Belt-and-suspenders: force offline even if a key ever leaks into the env.
    env:
      TECHCORP_OFFLINE: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v5
        with:
          # Cache uv's download/build artifacts, keyed on the lockfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked, incl. dev tools)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run the offline test suite
        run: uv run pytest -q
