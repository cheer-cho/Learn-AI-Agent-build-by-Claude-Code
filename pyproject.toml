[project]
name = "techcorp-agent"
version = "0.1.0"
description = "TechCorp AI Agents Lab Course — learn AI engineering by building one production agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.3",
    "chromadb>=0.6",
    "sentence-transformers>=3.3",
    "mcp>=1.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techcorp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "course"]
addopts = "-m 'not live' -q"
markers = [
    "live: requires a real LLM API key and spends credits (run with: pytest -m live)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "course", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Starter files intentionally contain unused imports/variables for learners to fill in.
"course/*/starter/*" = ["F401", "F841", "B007"]
