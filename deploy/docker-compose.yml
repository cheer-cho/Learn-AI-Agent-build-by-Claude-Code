# TechCorp Knowledge Agent — local/production compose (Module 21).
#
# `docker compose up` is OPTIONAL. The same service runs with no container at all:
#
#     uv run uvicorn apps.api.main:app
#
# Compose is here to show the *deployment* shape: one API service, its config
# from .env, and a named volume so the Chroma vector index (and the conversation
# memory DB) survive `docker compose down` / restarts.
#
# Run it from the REPO ROOT (the build context is the repo root so src/ + apps/
# are available to the Dockerfile):
#
#     docker compose -f deploy/docker-compose.yml up --build

services:
  api:
    build:
      # Build context is the repository root, not deploy/, so the Dockerfile can
      # COPY src/ and apps/.
      context: ..
      dockerfile: deploy/Dockerfile
    image: techcorp-agent-api
    ports:
      - "8000:8000"
    # Configuration per environment comes from .env at the repo root. Offline by
    # default; drop a real OPENAI_API_KEY in .env to serve with a live model.
    env_file:
      - ../.env
    environment:
      # Persist the vector index + memory DB onto the mounted volume so they
      # survive restarts (this path matches the Dockerfile's TECHCORP_MEMORY_DB).
      TECHCORP_MEMORY_DB: /app/.chroma/api_memory.sqlite3
    volumes:
      # Named volume mounted where the Chroma index and memory DB are written.
      - chroma-data:/app/.chroma
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  # The persistent vector-store volume: the index outlives the container.
  chroma-data:
